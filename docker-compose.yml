services:
  switchboard:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set}
      CHATGPT_BACKEND_BASE: ${CHATGPT_BACKEND_BASE:-https://chatgpt.com/backend-api}
    volumes:
      - ${CODEX_HOME:-${HOME}/.codex}:/host-codex:rw
      - ${DATA_DIR:-./backend/data}:/data
    restart: unless-stopped
