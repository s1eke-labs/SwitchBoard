services:
  switchboard:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      CODEX_HOME: ${CODEX_HOME:-/host-codex}
      SWITCHBOARD_DB: ${SWITCHBOARD_DB:-/data/switchboard.sqlite}
      CHATGPT_BACKEND_BASE: ${CHATGPT_BACKEND_BASE:-https://chatgpt.com/backend-api}
    volumes:
      - ${HOST_CODEX_HOME:-${HOME}/.codex}:/host-codex:rw
      - switchboard_data:/data
    restart: unless-stopped

volumes:
  switchboard_data:
